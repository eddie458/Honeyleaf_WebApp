<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- Linen weave with slubs: warp and weft threads of uneven thickness. -->
  <filter id="w" x="0" y="0" width="120" height="120" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.016 0.5" numOctaves="2" seed="7" stitchTiles="stitch" result="h"/>
    <feTurbulence type="fractalNoise" baseFrequency="0.5 0.016" numOctaves="2" seed="8" stitchTiles="stitch" result="v"/>
    <feColorMatrix in="h" type="matrix" values="0.42 0 0 0 0.66  0.42 0 0 0 0.66  0.42 0 0 0 0.66  0 0 0 0 1" result="h2"/>
    <feColorMatrix in="v" type="matrix" values="0.42 0 0 0 0.66  0.42 0 0 0 0.66  0.42 0 0 0 0.66  0 0 0 0 1" result="v2"/>
    <feBlend in="h2" in2="v2" mode="multiply"/>
  </filter>
  <rect width="120" height="120" filter="url(#w)"/>
</svg>
